<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find a bike ride that fits you across Tel Aviv, Ramat Gan, and Givatayim."
    />
    <meta name="theme-color" content="#064e3b" />
    <title>Bishvil — find your next ride</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('metrobike-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark)
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        const savedLanguage = localStorage.getItem('metrobike-language')
        const language = savedLanguage === 'he' || savedLanguage === 'en'
          ? savedLanguage
          : navigator.language.toLowerCase().startsWith('he') ? 'he' : 'en'
        document.documentElement.lang = language
        document.documentElement.dir = language === 'he' ? 'rtl' : 'ltr'
      } catch {
        // Local storage can be unavailable in privacy-restricted contexts.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
